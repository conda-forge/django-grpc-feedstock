{% set name = "django-grpc" %}
{% set version = "1.2.13" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/django_grpc-{{ version }}.tar.gz
  sha256: 70cacf1cba0a1d2485780ebff0713d6eeb8df9f745ac7b9540ce586bd562d45f

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
  run:
    - python >={{ python_min }}
    - setuptools
    - django >=4.2
    - protobuf >=4.21.4
    - grpcio >=1.47.0,<2.0.0
    - grpcio-tools >=1.47.0,<2.0.0

test:
  imports:
    - django_grpc
    - django_grpc_testtools
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/gluk-w/django-grpc
  summary: Easy Django based gRPC service
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - rxm7706
    - pb01ka
